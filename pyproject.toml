[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curvature-console"
version = "0.1.0"
description = "Three-department AI development console for Project Curvature."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
curvature-console = "curvature_console.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
